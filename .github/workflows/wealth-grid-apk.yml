name: Build Bharat Wealth Grid APK
on:
  push:
    paths: ['wealth-distribution/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        run: curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip && sudo unzip -q /tmp/gradle.zip -d /opt && sudo ln -sf /opt/gradle-8.10.2/bin/gradle /usr/local/bin/gradle
      - name: Build APK
        working-directory: wealth-distribution/android
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bharat-wealth-grid-apk
          path: wealth-distribution/android/app/build/outputs/apk/debug/app-debug.apk
